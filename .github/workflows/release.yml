name: Release

# Publishes a GitHub release whenever the "version" in manifest.json changes
# on main (or when run by hand from the Actions tab). The release is tagged
# v<version>; if that tag already exists, nothing happens.

on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: '1.26'

      - name: Test and build
        if: steps.version.outputs.skip != 'true'
        run: |
          go mod tidy
          go test -count=1 ./...
          make build VERSION="${{ steps.version.outputs.version }}"
          cd dist && sha256sum plex-artwork-sync-linux-* > checksums.txt

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/plex-artwork-sync-linux-amd64
            dist/plex-artwork-sync-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
